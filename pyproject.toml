[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-cli"
version = "0.1.0"
description = "The reality layer for AI coding agents. No claim without evidence. No action without reality."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VERITY" }]
keywords = ["ai-agents", "verification", "hallucination", "evidence", "mcp", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.29.1",
  "rich>=13",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "build>=1",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/Hmoute-Oussama/VERITY"
Documentation = "https://github.com/Hmoute-Oussama/VERITY#readme"
Repository = "https://github.com/Hmoute-Oussama/VERITY"
Issues = "https://github.com/Hmoute-Oussama/VERITY/issues"
Changelog = "https://github.com/Hmoute-Oussama/VERITY/blob/main/CHANGELOG.md"

[project.scripts]
verity = "verity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verity = ["server/dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
