name: Evidence contract

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install VERITY
        run: python -m pip install .
      - name: Initialize evidence configuration
        run: verity init --no-gitignore
      - name: Validate configuration
        run: verity validate --json
      - name: Check evidence contracts
        run: verity contract check --json
      - name: Snapshot
        run: verity snapshot --compact
