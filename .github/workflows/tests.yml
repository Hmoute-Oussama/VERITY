name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke
        shell: bash
        run: |
          verity --version
          smoke_dir=$(mktemp -d)
          verity --root "$smoke_dir" init --no-gitignore
          verity --root "$smoke_dir" doctor --json
          verity --root "$smoke_dir" validate --json

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*

  mcp-conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run MCP protocol tests
        run: python -m pytest tests/test_mcp.py
      - name: Run signing lifecycle tests
        run: python -m pytest tests/test_evidence_bundle.py tests/test_adversarial.py
