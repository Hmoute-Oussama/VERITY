name: Integration matrix

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install VERITY and pre-commit
        run: python -m pip install -e ".[dev]"
      - name: Run integration matrix
        run: python examples/run_matrix.py
      - name: Run integration matrix through pre-commit
        run: pre-commit run --all-files
