<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">VERITY</title>
  <desc id="desc">Evidence verification for AI coding agents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <g opacity=".13" stroke="#94a3b8">
    <path d="M0 70H1200M0 140H1200M0 210H1200"/>
    <path d="M120 0V280M300 0V280M480 0V280M660 0V280M840 0V280M1020 0V280"/>
  </g>

  <g transform="translate(90 75)">
    <circle cx="55" cy="55" r="48" fill="none" stroke="#22c55e" stroke-width="3" opacity=".9">
      <animate attributeName="r" values="48;52;48" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.35;.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="55" cy="55" r="34" fill="#22c55e" opacity=".12"/>
    <path d="M36 55l13 13 28-31" fill="none" stroke="#86efac" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(220 68)">
    <text x="0" y="82" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="12">VERITY</text>
    <rect x="4" y="112" width="710" height="5" rx="3" fill="url(#accent)">
      <animate attributeName="width" values="0;710;710" dur="3s" keyTimes="0;.75;1" repeatCount="indefinite"/>
    </rect>
    <text x="4" y="155" fill="#cbd5e1" font-family="Consolas,Menlo,monospace" font-size="23" letter-spacing="2">
      evidence for AI coding agents
    </text>
  </g>

  <g transform="translate(1040 125)">
    <circle cx="0" cy="0" r="11" fill="#22c55e">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="21" fill="none" stroke="#22c55e" stroke-width="2" opacity=".5">
      <animate attributeName="r" values="17;30;17" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
