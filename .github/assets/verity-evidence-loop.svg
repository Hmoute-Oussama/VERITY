<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Evidence decay loop</title>
  <desc id="description">Evidence stays verified until source dependencies change</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#07111f"/>
      <stop offset=".5" stop-color="#111827"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(180 150)">
      <circle r="82" fill="#0f172a" stroke="#22c55e" stroke-width="4"/>
      <circle r="58" fill="#22c55e" opacity=".12"/>
      <text y="8" text-anchor="middle" fill="#86efac" font-size="30" font-weight="800">VERIFY</text>
    </g>
    <g transform="translate(600 150)">
      <circle r="82" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
      <circle r="58" fill="#38bdf8" opacity=".12"/>
      <text y="8" text-anchor="middle" fill="#7dd3fc" font-size="30" font-weight="800">WATCH</text>
    </g>
    <g transform="translate(1020 150)">
      <circle r="82" fill="#0f172a" stroke="#ef4444" stroke-width="4"/>
      <circle r="58" fill="#ef4444" opacity=".12"/>
      <text y="8" text-anchor="middle" fill="#fca5a5" font-size="30" font-weight="800">REFRESH</text>
    </g>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-dasharray="12 12">
    <path d="M262 150H518">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M682 150H938">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#38bdf8">
    <circle r="7">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M262 150H938"/>
    </circle>
  </g>
  <text x="600" y="48" text-anchor="middle" fill="#cbd5e1" font-family="Consolas,monospace" font-size="18">
    SHA-256 dependencies keep truth connected to the current tree
  </text>
</svg>
